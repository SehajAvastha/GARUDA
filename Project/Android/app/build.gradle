plugins {
    id 'com.android.application'
}

def garudaPackageName = project.hasProperty('packageName')
        ? project.property('packageName').toString()
        : 'com.sehajavastha.garuda'

android {
    namespace 'com.sehajavastha.garuda'
    compileSdk 35
    ndkVersion '27.2.12479018' // Matches your android-ndk-r27d

    defaultConfig {
        applicationId garudaPackageName
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DGARUDA_PACKAGE_NAME=${garudaPackageName}",
                          "-DANDROID_STL=c++_shared"
                cppFlags '-std=c++20'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('../../../CMakeLists.txt')
            version '3.24.0+'
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']

            // Automatically find SDL3's Java sources inside CMake's .cxx FetchContent folder
            def cxxDir = file('.cxx')
            if (cxxDir.exists()) {
                cxxDir.eachFileRecurse { dir ->
                    if (dir.isDirectory() && dir.path.replace('\\', '/').endsWith('_deps/sdl3-src/android-project/app/src/main/java')) {
                        java.srcDir(dir)
                    }
                }
            }
        }
    }
}
